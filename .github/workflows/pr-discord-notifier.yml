name: Discord PR Notification

on:
  pull_request:
    types: [opened, closed, reopened]
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  notify-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord PR notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          TIMESTAMP: ${{ github.event.pull_request.updated_at }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret not configured; skipping Discord notification."
            exit 0
          fi

          if [ "$ACTION" = "opened" ]; then
            COLOR=3447003           # Blue (#3498db)
            HEADLINE="📝 PR Opened by ${PR_AUTHOR}"
          elif [ "$ACTION" = "reopened" ]; then
            COLOR=15844367          # Gold (#f1c40f)
            HEADLINE="🔄 PR Reopened by ${PR_AUTHOR}"
          elif [ "$ACTION" = "closed" ]; then
            if [ "$MERGED" = "true" ]; then
              COLOR=5763719         # Green (#57f287)
              HEADLINE="✅ Merged by ${MERGED_BY}"
            else
              COLOR=15548997        # Red (#ed4245)
              HEADLINE="🔴 Closed without merging"
            fi
          else
            echo "Action ${ACTION} not configured for notification; skipping."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg title "#${PR_NUMBER} ${PR_TITLE}" \
            --arg url "$PR_URL" \
            --arg desc "$HEADLINE" \
            --arg author "$PR_AUTHOR" \
            --arg avatar "$PR_AUTHOR_AVATAR" \
            --arg branch "\`${HEAD_REF}\` → \`${BASE_REF}\`" \
            --arg repo "$REPO" \
            --arg ts "$TIMESTAMP" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: ($title | .[0:250]),
                url: $url,
                description: $desc,
                color: $color,
                author: { name: $author, icon_url: $avatar },
                fields: [
                  { name: "Target Branch", value: $branch, inline: true }
                ],
                footer: { text: $repo },
                timestamp: $ts
              }]
            }')

          curl -sS --fail \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
