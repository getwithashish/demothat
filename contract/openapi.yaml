# contract/openapi.yaml
# CONTRACT VERSION: 2.3.0
#
# OWNER: demothat-api. This file is the source of truth for the app -> API
# contract. `demothat` vendors a pinned copy and its CI fails when the version
# header drifts from the one it declares it targets.
#
# Any contract change is made HERE first, then re-pinned downstream.
# See docs/SHARED_SPEC.md (Section 0) for the specification this implements.

openapi: 3.1.0
info:
  title: DemoThat API
  version: 2.3.0
  description: >-
    Pro licensing, credit ledger, cloud upscaling jobs, cloud transcription and
    instant publishing for the DemoThat
    desktop app. This file is the app-to-API contract; the API-to-worker contract
    lives in contract/worker-protocol.md plus the JSON Schemas in contract/schemas/.
  contact:
    name: DemoThat
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.demothat.yahodu.in
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: meta
    description: Health and capability discovery
  - name: billing
    description: Checkout, purchases and webhooks
  - name: license
    description: License activation, tokens and devices
  - name: jobs
    description: Cloud upscaling jobs
  - name: transcription
    description: Cloud transcription jobs (audio in, timestamped transcript out)
  - name: publishing
    description: >-
      Instant publishing: hosted landing pages, direct download links and embeddable
      players, with per-publication analytics. Charged from the credit balance for a
      term of storage; deleting a publication never refunds it.
  - name: public
    description: >-
      What a viewer's browser touches: the landing page, the embeddable player, the
      video and caption downloads, and the analytics beacon. Unauthenticated by
      design, rate limited, and reachable by anyone the link was shared with.
  - name: internal
    description: Worker callbacks and operator tasks

paths:
  /health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Start a purchase (first purchase, or a top-up with a token)
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/purchases/{id}:
    get:
      operationId: getPurchase
      tags: [billing]
      summary: Poll a purchase; returns the license key exactly once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Poll-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Purchase status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/dodo:
    post:
      operationId: dodoWebhook
      tags: [billing]
      summary: Dodo webhook (Standard Webhooks signature verified)
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema:
            type: string
        - name: webhook-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: webhook-signature
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event accepted (may be ignored or a duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  handled:
                    type: boolean
                  duplicate:
                    type: boolean
                  type:
                    type: string
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /thanks:
    get:
      operationId: thanksPage
      tags: [billing]
      summary: Static post-payment page (grants nothing)
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /v1/license/activate:
    post:
      operationId: activateLicense
      tags: [license]
      summary: Activate a device against a license key and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: License revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Device limit reached (returns the device list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many activation attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/license:
    get:
      operationId: getLicense
      tags: [license]
      summary: Current license, balance and devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: License view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/devices/{id}:
    delete:
      operationId: deactivateDevice
      tags: [license]
      summary: Deactivate a device (through Dodo and locally)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated license view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [meta]
      summary: Pricing table, targets, limits and models
      security: []
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'

  /v1/products:
    get:
      operationId: listProducts
      tags: [meta]
      summary: What is for sale, with live prices
      description: >-
        Public: the website renders its pricing from this rather than hard-coding a
        product id or an amount. `credits` is the server-side truth that checkout
        charges from; the money comes from the payment provider, so there is one
        source of truth for it. `price` is null when the provider could not be
        reached — the credits are still exact.
      security: []
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'

  /v1/jobs:
    post:
      operationId: createJob
      tags: [jobs]
      summary: Credit preflight with the declared numbers, then upload URLs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: Job created, upload plan returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Insufficient credits (carries estimatedCost and balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A job is already running for this license
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Daily job limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloud upscaling disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/jobs/transcribe:
    post:
      operationId: createTranscribeJob
      tags: [transcription]
      summary: Credit preflight for a transcription, then the audio upload URL
      description: >-
        The same shape as `POST /v1/jobs`, for an audio file instead of a video.
        The preflight prices the *declared* audio length; the server re-prices
        from its own probe of the uploaded audio and that number is final (0.8).
        Settlement follows the same reserve/settle/refund rules as an upscale
        (0.3), priced per minute of audio rather than per frame. The transcript
        is delivered as a JSON object and fetched through the same `downloadUrl`
        on the job view.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranscribeJobRequest'
      responses:
        '200':
          description: Job created, upload plan returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Insufficient credits (carries estimatedCost and balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A job is already running for this license
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Daily job limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloud transcription disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Job status, progress and a fresh download URL
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job, applying the settlement rules
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            `canceling` while a running job winds down, `canceled` once it is
            settled. If the job was already terminal when the request arrived, its
            actual status is returned instead (`succeeded`, `failed`, `rejected`),
            because claiming a cancel that never happened would be misleading.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [canceling, canceled, succeeded, failed, rejected]

  /v1/jobs/{id}/upload/complete:
    post:
      operationId: completeJobUpload
      tags: [jobs]
      summary: Finish the source upload (required for multipart)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber:
                        type: integer
                      etag:
                        type: string
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/jobs/{id}/start:
    post:
      operationId: startJob
      tags: [jobs]
      summary: Begin validation and hand the job to the worker; returns immediately
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validating
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [validating]
        '409':
          description: Job is not uploaded, or another job is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloud upscaling disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/publications:
    post:
      operationId: createPublication
      tags: [publishing]
      summary: Price a publication from the declared size, then hand out upload URLs
      description: >-
        The credit preflight and the upload plan, in the same two-phase shape as
        `POST /v1/jobs`. **Nothing is charged here.** The price is recomputed from
        the size the store reports once the upload completes, because a
        client-declared size is never what a price comes from.

        `storageDays` is the term the user buys, and it is also how long the link
        lives — one number, because the link is what the storage is for.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '200':
          description: Publication created, upload plan returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: >-
            The balance cannot cover the quoted price. `details.cost` and
            `details.balance` say by how much.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Publishing is disabled for this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listPublications
      tags: [publishing]
      summary: Every publication on this license, newest first
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Publications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/publications/{id}:
    get:
      operationId: getPublication
      tags: [publishing]
      summary: One publication, with its links and which surfaces it serves
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationView'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokePublication
      tags: [publishing]
      summary: Delete a publication — immediately, and without refunding it
      description: >-
        The bytes are deleted and the link stops resolving at once: the object is
        never served from a long-lived URL, which is what makes this instant. The
        credits do not come back, because the storage term was bought at
        activation; `creditsRefunded` is always 0 and is in the response so the app
        can say so plainly. Analytics are kept.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [publicationId, status, creditsRefunded]
                properties:
                  publicationId:
                    type: string
                  status:
                    $ref: '#/components/schemas/PublicationStatus'
                  creditsRefunded:
                    type: integer
                    description: Always 0. Present so the app can state it.
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/publications/{id}/upload/complete:
    post:
      operationId: completePublicationUpload
      tags: [publishing]
      summary: Finish the upload, price the stored object and charge for the term
      description: >-
        `HEAD`s the object, prices the **real** size, debits the balance and
        activates the publication in one transaction. A publication that is already
        active returns the same view rather than charging again, so a retried
        request is safe. A completion whose upload never landed, or whose real
        price the balance cannot cover, deletes the object and charges nothing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  description: Required for a multipart upload; ignored for a single PUT.
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber:
                        type: integer
                      etag:
                        type: string
                captionsVtt:
                  type: string
                  maxLength: 2000000
                  description: >-
                    The caption track as WebVTT text. It travels here rather than as
                    an upload because it is a document, not media — tens of
                    kilobytes — and because it is then served same-origin, where a
                    `<track>` fetch needs no bucket CORS configuration to work.
                    Its first line must be `WEBVTT`.

                    Not part of the price: the rate is per GB of video.
      responses:
        '200':
          description: Active
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationView'
                  - type: object
                    required: [balance]
                    properties:
                      balance:
                        type: integer
                        description: The license balance after the charge.
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: >-
            The stored object costs more than the balance covers. The object is
            deleted and nothing is charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The publication is not awaiting an upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/publications/{id}/analytics:
    get:
      operationId: getPublicationAnalytics
      tags: [publishing]
      summary: Who watched, from where, and how much
      description: >-
        Read-time aggregation over the publication's events, so the numbers cannot
        drift from the events they describe. **Unique viewers are sessions, not
        people**: the player mints a random id per browser tab, and a viewer who opens
        the link twice counts twice. No cookie, no login, no fingerprint, and no IP is
        stored — the country comes from Cloudflare's `CF-IPCountry`. Requests that
        identify as a bot are not recorded at all, so link unfurlers and monitors do
        not arrive as views, and a download is counted as a download rather than as a
        viewer who watched nothing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        '200':
          description: Analytics for the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /p/{slug}:
    get:
      operationId: getLandingPage
      tags: [public]
      summary: The hosted landing page (HTML)
      description: >-
        The `page` kind's landing page: the player, the downloads and the expiry line,
        and nothing else — no sign-up and no cookie banner, because playing a video
        and counting a view need neither. A link that is gone, revoked or expired
        renders a page saying so with a 404, not an error envelope.

        The page never contains a lasting credential: the video's URL is a short-lived
        signed URL minted per request, which is what makes deleting a link take effect
        immediately.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationSlug'
      responses:
        '200':
          description: The page
          content:
            text/html:
              schema:
                type: string
        '404':
          description: The publication is not servable; the body is still a page
          content:
            text/html:
              schema:
                type: string

  /e/{slug}:
    get:
      operationId: getEmbedPlayer
      tags: [public]
      summary: The embeddable player (HTML, meant to be framed)
      description: >-
        Served with `frame-ancestors *`, scoped to this route alone: everything else on
        this origin refuses framing. It is the target of the `embedCode` the app hands
        the user.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationSlug'
      responses:
        '200':
          description: The player page
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /v/{slug}/video.mp4:
    get:
      operationId: streamPublicationVideo
      tags: [public]
      summary: The player's video source — a 302 to a short-lived signed URL
      description: >-
        The bytes come straight from the object store, so this service never proxies a
        video; the redirect is re-minted per request, which is what makes a deleted
        link stop working at once. Range requests go to the store directly.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationSlug'
      responses:
        '302':
          description: A signed URL for the object
        '404':
          $ref: '#/components/responses/NotFound'

  /v/{slug}/captions.vtt:
    get:
      operationId: getPublicationCaptions
      tags: [public]
      summary: The caption track, served same-origin
      description: >-
        Served from the database rather than redirected to the store, because a
        `<track>` fetch is a CORS request and a signed object URL would need bucket CORS
        headers to be readable at all. Here it is plain `text/vtt` with
        `access-control-allow-origin: *` and no storage credential.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationSlug'
      responses:
        '200':
          description: The WebVTT track
          content:
            text/vtt:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /d/{slug}/video.mp4:
    get:
      operationId: downloadPublicationVideo
      tags: [public]
      summary: The video download link — a 302, recorded as a download
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationSlug'
      responses:
        '302':
          description: A signed URL with an attachment disposition
        '404':
          $ref: '#/components/responses/NotFound'

  /d/{slug}/captions.vtt:
    get:
      operationId: downloadPublicationCaptions
      tags: [public]
      summary: The caption download link, recorded as a download
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationSlug'
      responses:
        '200':
          description: The WebVTT track as an attachment
          content:
            text/vtt:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /a/{slug}/event:
    post:
      operationId: recordPublicationEvent
      tags: [public]
      summary: The viewer beacon (unauthenticated, rate limited)
      description: >-
        Sent by the player's inline script with `navigator.sendBeacon`, which is why
        `text/plain` is accepted as well as JSON — that is what avoids a CORS preflight
        on every event. The body is parsed as JSON either way.

        Answers 204 for a publication that is gone rather than 404: the page is already
        open in a stranger's browser, and an error they cannot act on is noise.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEventRequest'
          text/plain:
            schema:
              type: string
              description: The same JSON, sent by `sendBeacon`.
      responses:
        '204':
          description: Recorded, or deliberately dropped
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many beacons from this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/jobs/{id}/probe-result:
    post:
      operationId: workerProbeResult
      tags: [internal]
      summary: Worker reports probe findings (HMAC signed with the job secret)
      security: []
      parameters:
        - $ref: '#/components/parameters/WorkerSignature'
        - $ref: '#/components/parameters/WorkerTimestamp'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/jobs/{id}/heartbeat:
    post:
      operationId: workerHeartbeat
      tags: [internal]
      summary: Worker progress; the response carries the cancel flag
      security: []
      parameters:
        - $ref: '#/components/parameters/WorkerSignature'
        - $ref: '#/components/parameters/WorkerTimestamp'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancel flag
          content:
            application/json:
              schema:
                type: object
                required: [cancel]
                properties:
                  cancel:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/jobs/{id}/complete:
    post:
      operationId: workerComplete
      tags: [internal]
      summary: Worker reports the final outcome; the job is settled
      security: []
      parameters:
        - $ref: '#/components/parameters/WorkerSignature'
        - $ref: '#/components/parameters/WorkerTimestamp'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/reap:
    post:
      operationId: reapJobs
      tags: [internal]
      summary: Operator backstop; reaps stale jobs and expired cancels
      security: []
      parameters:
        - name: X-Reap-Secret
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  reaped:
                    type: integer
                  canceled:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    PublicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The publication id returned by `POST /v1/publications`.
    PublicationSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: >-
        The unguessable public id from the share link. It is the only thing a viewer
        sees, and it is the only thing that grants access.
    WorkerSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC-SHA256 of `{timestamp}.{raw body}` with the per-job callback secret
    WorkerTimestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
      description: Unix seconds; stale requests are rejected
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or signature invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, service, version, env, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          examples: [demothat-api]
        version:
          type: string
        env:
          type: string
          enum: [development, test, production]
        commit:
          type: [string, 'null']
        time:
          type: string
          format: date-time
    CheckoutRequest:
      type: object
      required: [productId]
      properties:
        productId:
          type: string
          description: Dodo product id; the credit amount comes from the server-side PRODUCTS table
        deviceIdHash:
          type: string
          description: Optional opaque device hash carried through for the app
    CheckoutResponse:
      type: object
      required: [purchaseId, pollToken, checkoutUrl]
      properties:
        purchaseId:
          type: string
        pollToken:
          type: string
          description: Shown once; send it as X-Poll-Token when polling
        checkoutUrl:
          type: string
          format: uri
    PurchaseStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, succeeded, failed]
        balance:
          type: integer
          description: License credit balance once the license exists
        licenseKey:
          type: string
          description: Returned exactly once, on a first purchase, then removed
    DeviceView:
      type: object
      required: [id, label, platform, active, activatedAt, lastSeenAt, current]
      properties:
        id:
          type: string
        label:
          type: string
        platform:
          type: string
        active:
          type: boolean
        activatedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the device making the request
    ActivateRequest:
      type: object
      required: [licenseKey, deviceIdHash, label, platform]
      properties:
        licenseKey:
          type: string
        deviceIdHash:
          type: string
          description: Client-computed hash of the device identifier
        label:
          type: string
        platform:
          type: string
    ActivateResponse:
      type: object
      required: [token, balance, devices]
      properties:
        token:
          type: string
          description: EdDSA license token; send as Authorization Bearer
        balance:
          type: integer
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceView'
    LicenseView:
      type: object
      required: [plan, balance, devices]
      properties:
        plan:
          type: string
        balance:
          type: integer
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceView'
    Capabilities:
      type: object
      required: [creditsPerFrame, targets, limits, models, minChargeCredits, cloudEnabled]
      properties:
        creditsPerFrame:
          type: object
          additionalProperties:
            type: number
        targets:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            maxDurationSeconds:
              type: integer
            maxTargetWidth:
              type: integer
            maxTargetHeight:
              type: integer
            maxFileSizeBytes:
              type: integer
            maxConcurrentJobs:
              type: integer
            dailyJobCap:
              type: integer
        models:
          type: array
          items:
            type: string
        minChargeCredits:
          type: integer
        cloudEnabled:
          type: boolean
        multipartThresholdBytes:
          type: integer
        transcription:
          $ref: '#/components/schemas/TranscriptionCapabilities'
        publishing:
          $ref: '#/components/schemas/PublishingCapabilities'
    TranscriptionCapabilities:
      type: object
      description: >-
        What the transcription service publishes so the app can quote a price
        before it uploads anything. `creditsPerMinute` is the same number the
        server charges from; the app mirrors it for the estimate and never
        sends a price of its own.
      required: [enabled, creditsPerMinute, models]
      properties:
        enabled:
          type: boolean
          description: False when cloud transcription is switched off for this deployment.
        creditsPerMinute:
          type: number
          minimum: 0
          description: >-
            Credits per minute of probed audio, `ceil`ed. Defaults to the cost of
            a 30 fps 1080p cloud upscale of the same clip, so transcription
            starts out priced like the export it accompanies.
        models:
          type: array
          items:
            type: string
          description: Model names `CreateTranscribeJobRequest.model` accepts.
        maxAudioSeconds:
          type: integer
          description: Longest audio the worker will accept.
    PublishingCapabilities:
      type: object
      description: >-
        What the publishing service publishes so the app can quote a publication
        before it uploads anything. `creditsPerGbYear` is the same rate the server
        charges from; the app mirrors it for the estimate and never sends a price
        of its own.

        The published units are decimal — 1 GB is 1,000,000,000 bytes — which is
        the unit the rate is quoted in, and using GiB here would overcharge by 7.4%.
      required:
        [enabled, creditsPerGbYear, landingPageCredits, minCredits, durationsDays, defaultDurationDays, maxSizeBytes, baseUrl, kinds]
      properties:
        enabled:
          type: boolean
          description: False when publishing is switched off for this deployment.
        creditsPerGbYear:
          type: number
          minimum: 0
          description: >-
            Credits per GB per year of storage. 1200 is $2.00/GB/year at 600
            credits per dollar.
        landingPageCredits:
          type: integer
          description: Flat surcharge for the hosted landing page, on top of storage.
        minCredits:
          type: integer
          minimum: 1
          description: The floor charged for any publication at all.
        durationsDays:
          type: array
          items:
            type: integer
          description: The terms on offer, in days, ascending. The app renders these.
        defaultDurationDays:
          type: integer
          description: The term the app preselects — the longest one offered.
        maxSizeBytes:
          type: integer
          description: Largest video a publication may carry.
        baseUrl:
          type: string
          format: uri
          description: The origin the share links, landing pages and embeds are built on.
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/PublicationKind'
    PublicationKind:
      type: string
      description: >-
        What a publication serves. `page` is the hosted landing page plus the
        player, the embed snippet and the direct links; `embed` is the player and
        the direct links, with no landing page; `links` is the direct download
        links alone. All three are priced from the same storage term, and only
        `page` carries the landing-page surcharge.
      enum: [page, links, embed]
    PublicationStatus:
      type: string
      enum: [awaiting_upload, active, revoked, expired, failed]
      description: >-
        `awaiting_upload` is created but not charged; `active` is uploaded, charged
        and served; `revoked` was deleted by the user; `expired` ran out its term
        and had its bytes deleted; `failed` was never charged (an upload that never
        landed, or one the balance could not cover).
    PublicationLinks:
      type: object
      description: >-
        Where a publication can be reached. Every one of these is on our own
        origin: the object URL is minted per request after the publication is
        checked, so deleting a publication takes effect immediately and the embed
        snippet carries nothing that could outlive it.
      required: [videoDownloadUrl]
      properties:
        pageUrl:
          type: string
          format: uri
          description: The landing page. Absent for `links` and `embed`.
        embedUrl:
          type: string
          format: uri
          description: The embeddable player. Absent for `links`.
        embedCode:
          type: string
          description: HTML to paste. Same-origin iframe; no credentials inside.
        videoDownloadUrl:
          type: string
          format: uri
        captionsDownloadUrl:
          type: string
          format: uri
          description: Present only when the publication really carries captions.
    CreatePublicationRequest:
      type: object
      required: [kind, fileSizeBytes, storageDays]
      properties:
        kind:
          $ref: '#/components/schemas/PublicationKind'
        fileSizeBytes:
          type: integer
          minimum: 1
          description: >-
            The video's size as the app knows it. A preflight only — the price is
            recomputed from the size the store reports at completion.
        storageDays:
          type: integer
          description: >-
            The term bought, and how long the link lives. One of
            `PublishingCapabilities.durationsDays`.
        title:
          type: string
          description: Shown on the landing page and in the player. Defaults if omitted.
        durationSec:
          type: number
          description: The video's length, for the analytics' "watched 40% of it".
        captionLanguage:
          type: string
    CreatePublicationResponse:
      type: object
      required: [publicationId, slug, estimatedCost, storageDays, upload, expiresAt]
      properties:
        publicationId:
          type: string
        slug:
          type: string
          description: The unguessable public id the share links are built from.
        estimatedCost:
          type: integer
          description: The quote, from the declared size. Not a charge.
        storageDays:
          type: integer
        upload:
          oneOf:
            - type: object
              required: [type, url]
              properties:
                type:
                  type: string
                  enum: [single]
                url:
                  type: string
                  format: uri
            - type: object
              required: [type, uploadId, partSize, partUrls]
              properties:
                type:
                  type: string
                  enum: [multipart]
                uploadId:
                  type: string
                partSize:
                  type: integer
                partUrls:
                  type: array
                  items:
                    type: string
                    format: uri
        expiresAt:
          type: string
          format: date-time
          description: >-
            Provisional until activation: the term starts when the bytes land, not
            when the user picked a video.
    PublicationView:
      type: object
      required:
        [publicationId, kind, slug, title, status, storageDays, estimatedCost, hasCaptions, createdAt, expiresAt, served, links]
      properties:
        publicationId:
          type: string
        kind:
          $ref: '#/components/schemas/PublicationKind'
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/PublicationStatus'
        sizeBytes:
          type: integer
          description: The size the store reported. The price basis. Present once charged.
        durationSec:
          type: number
        storageDays:
          type: integer
        creditsCharged:
          type: integer
          description: What was actually charged, once the publication is active.
        estimatedCost:
          type: integer
        hasCaptions:
          type: boolean
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
          description: When the term started, and therefore from when it is counted.
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        served:
          type: object
          required: [page, embed, links]
          properties:
            page:
              type: boolean
            embed:
              type: boolean
            links:
              type: boolean
        links:
          $ref: '#/components/schemas/PublicationLinks'
    PublicationList:
      type: object
      required: [publications]
      properties:
        publications:
          type: array
          items:
            $ref: '#/components/schemas/PublicationView'
    PublishEventRequest:
      type: object
      description: >-
        One beacon from the player. Every field ends up in an aggregate, never in a
        person: there is no cookie, no login, and the session id is a random string the
        server cannot map back to anyone.
      required: [type, sessionId]
      properties:
        type:
          type: string
          enum: [view, play, progress, complete, download_video, download_captions]
          description: >-
            `view` when the page loads, `play` on the first play, `progress` on a
            heartbeat while playing (so watch time survives a closed tab), `complete`
            at the end, and the two `download_*` types from the download routes.
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
          description: Random per browser tab, minted by the player. The unit of "unique viewer".
        referrer:
          type: string
          maxLength: 2048
          description: >-
            `document.referrer` — the page the viewer came from, not the beacon's own.
            Reduced to a host before it is stored, so search terms and private paths
            never land in the database.
        watchedSeconds:
          type: number
          minimum: 0
          maximum: 86400
          description: The furthest point reached, so seeking does not inflate watch time.
        watchedRatio:
          type: number
          minimum: 0
          maximum: 1
    PublicationAnalytics:
      type: object
      required:
        [publicationId, slug, title, status, range, since, until, totals, timeseries, countries, referrers, devices, browsers, recent]
      properties:
        publicationId:
          type: string
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/PublicationStatus'
        durationSec:
          type: number
          nullable: true
        range:
          type: string
          enum: [7d, 30d, 90d, all]
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        totals:
          $ref: '#/components/schemas/AnalyticsTotals'
        timeseries:
          type: array
          description: One point per day that had activity, ascending.
          items:
            type: object
            required: [date, views, uniqueViewers, watchedSeconds]
            properties:
              date:
                type: string
                description: '`YYYY-MM-DD`, UTC.'
              views:
                type: integer
              uniqueViewers:
                type: integer
              watchedSeconds:
                type: integer
        countries:
          type: array
          description: By `CF-IPCountry`. Empty when the deployment is not behind Cloudflare.
          items:
            $ref: '#/components/schemas/AnalyticsDimensionRow'
        referrers:
          type: array
          items:
            type: object
            required: [key, class, uniqueViewers]
            properties:
              key:
                type: string
                description: The referring host, or `unknown`.
              class:
                type: string
                enum: [direct, search, social, internal, other]
              uniqueViewers:
                type: integer
        devices:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDimensionRow'
        browsers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDimensionRow'
        recent:
          type: array
          description: The last 50 events, newest first.
          items:
            type: object
            required: [at, type]
            properties:
              at:
                type: string
                format: date-time
              type:
                type: string
                enum: [view, play, progress, complete, download_video, download_captions]
              country:
                type: string
              referrerHost:
                type: string
              device:
                type: string
              browser:
                type: string
              watchedSeconds:
                type: integer
    AnalyticsTotals:
      type: object
      description: >-
        `uniqueViewers`, `avgWatchSeconds`, `avgWatchRatio` and `completionRate` are
        per session; `views`, `plays`, `completions` and `downloads` are event counts.
        Watch time is the sum of each session's furthest point, never the sum of the
        player's heartbeats — a viewer whose player sent thirty beacons watched one
        video, not thirty.
      required:
        [views, uniqueViewers, plays, completions, downloads, watchedSeconds, avgWatchSeconds, avgWatchRatio, completionRate]
      properties:
        views:
          type: integer
        uniqueViewers:
          type: integer
        plays:
          type: integer
        completions:
          type: integer
        downloads:
          type: integer
        watchedSeconds:
          type: integer
        avgWatchSeconds:
          type: integer
        avgWatchRatio:
          type: number
        completionRate:
          type: number
    AnalyticsDimensionRow:
      type: object
      required: [key, uniqueViewers]
      properties:
        key:
          type: string
          description: The bucket, or `unknown` when the header did not say.
        uniqueViewers:
          type: integer
    ProductPrice:
      type: object
      description: >-
        A price as rendered, not as charged. `amountMinor` is an integer in the
        smallest denomination of `currency`, so divide by 10^`minorUnitExponent` —
        2 for USD, but 0 for zero-decimal currencies such as JPY, which is why the
        exponent is published instead of assumed.
      required: [amountMinor, currency, minorUnitExponent, isMinimum]
      properties:
        amountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          examples: [USD]
        minorUnitExponent:
          type: integer
          minimum: 0
        isMinimum:
          type: boolean
          description: >-
            true when `amountMinor` is a floor rather than the price, i.e. the
            product is pay-what-you-want.
    Product:
      type: object
      required: [productId, kind, credits, price]
      properties:
        productId:
          type: string
          description: Pass this back to `POST /v1/checkout`.
        kind:
          type: string
          enum: [first_purchase, topup]
        credits:
          type: integer
          minimum: 1
          description: Credits granted by one unit. Server-side truth (0.8).
        name:
          type: string
        description:
          type: string
        isRecurring:
          type: boolean
        price:
          description: null when the payment provider could not be reached.
          oneOf:
            - $ref: '#/components/schemas/ProductPrice'
            - type: 'null'
    ProductList:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CreateJobRequest:
      type: object
      required:
        [sourceWidth, sourceHeight, fps, durationSec, fileSizeBytes, targetWidth, targetHeight]
      properties:
        sourceWidth:
          type: integer
        sourceHeight:
          type: integer
        fps:
          type: number
        durationSec:
          type: number
        fileSizeBytes:
          type: integer
        targetWidth:
          type: integer
        targetHeight:
          type: integer
    CreateTranscribeJobRequest:
      type: object
      required: [audioSeconds, fileSizeBytes]
      properties:
        audioSeconds:
          type: number
          description: >-
            Declared length of the audio about to be uploaded. Used for the
            preflight only; the charge comes from the server's own probe.
        fileSizeBytes:
          type: integer
        language:
          type: string
          description: ISO-639-1 hint, or `auto` to let the model decide.
        model:
          type: string
          description: One of `Capabilities.transcription.models`; omit for the server default.
    CreateJobResponse:
      type: object
      required: [jobId, estimatedCost, upload]
      properties:
        jobId:
          type: string
        estimatedCost:
          type: integer
        upload:
          oneOf:
            - type: object
              required: [type, url]
              properties:
                type:
                  type: string
                  enum: [single]
                url:
                  type: string
                  format: uri
            - type: object
              required: [type, uploadId, partSize, partUrls]
              properties:
                type:
                  type: string
                  enum: [multipart]
                uploadId:
                  type: string
                partSize:
                  type: integer
                partUrls:
                  type: array
                  items:
                    type: string
                    format: uri
    JobView:
      type: object
      required: [status, stage, progress, reserved, consumed, cost, kind]
      properties:
        kind:
          type: string
          enum: [upscale, transcribe]
          description: >-
            What this job does. `upscale` jobs report `framesDone`/`totalFrames`;
            `transcribe` jobs report `audioSecondsDone`/`audioSeconds` instead.
        status:
          type: string
          enum:
            [
              created,
              uploading,
              uploaded,
              validating,
              rejected,
              queued,
              running,
              canceling,
              canceled,
              succeeded,
              failed,
              expired,
            ]
        stage:
          type: string
        progress:
          type: number
        framesDone:
          type: integer
          description: Frames written to the encoder. Present for `upscale` jobs only.
        totalFrames:
          type: integer
          description: Present for `upscale` jobs only.
        audioSeconds:
          type: number
          description: >-
            Audio length the worker probed, and the basis of the charge. Present
            for `transcribe` jobs only.
        audioSecondsDone:
          type: number
          description: Audio processed so far. Present for `transcribe` jobs only.
        reserved:
          type: integer
        consumed:
          type: integer
        etaSeconds:
          type: integer
        cost:
          type: integer
        charge:
          type: integer
        refund:
          type: integer
        downloadUrl:
          type: string
          format: uri
        error:
          type: object
          properties:
            code:
              type: string
            class:
              type: string
              enum: [input, infra]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [validation_error]
            message:
              type: string
            details: {}
