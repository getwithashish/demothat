# contract/openapi.yaml
# CONTRACT VERSION: 2.2.0
#
# OWNER: demothat-api. This file is the source of truth for the app -> API
# contract. `demothat` vendors a pinned copy and its CI fails when the version
# header drifts from the one it declares it targets.
#
# Any contract change is made HERE first, then re-pinned downstream.
# See docs/SHARED_SPEC.md (Section 0) for the specification this implements.

openapi: 3.1.0
info:
  title: DemoThat API
  version: 2.2.0
  description: >-
    Pro licensing, credit ledger, cloud upscaling jobs and cloud transcription
    for the DemoThat
    desktop app. This file is the app-to-API contract; the API-to-worker contract
    lives in contract/worker-protocol.md plus the JSON Schemas in contract/schemas/.
  contact:
    name: DemoThat
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.demothat.app
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: meta
    description: Health and capability discovery
  - name: billing
    description: Checkout, purchases and webhooks
  - name: license
    description: License activation, tokens and devices
  - name: jobs
    description: Cloud upscaling jobs
  - name: transcription
    description: Cloud transcription jobs (audio in, timestamped transcript out)
  - name: internal
    description: Worker callbacks and operator tasks

paths:
  /health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Start a purchase (first purchase, or a top-up with a token)
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/purchases/{id}:
    get:
      operationId: getPurchase
      tags: [billing]
      summary: Poll a purchase; returns the license key exactly once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Poll-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Purchase status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/dodo:
    post:
      operationId: dodoWebhook
      tags: [billing]
      summary: Dodo webhook (Standard Webhooks signature verified)
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema:
            type: string
        - name: webhook-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: webhook-signature
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event accepted (may be ignored or a duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  handled:
                    type: boolean
                  duplicate:
                    type: boolean
                  type:
                    type: string
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /thanks:
    get:
      operationId: thanksPage
      tags: [billing]
      summary: Static post-payment page (grants nothing)
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /v1/license/activate:
    post:
      operationId: activateLicense
      tags: [license]
      summary: Activate a device against a license key and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: License revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Device limit reached (returns the device list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many activation attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/license:
    get:
      operationId: getLicense
      tags: [license]
      summary: Current license, balance and devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: License view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/devices/{id}:
    delete:
      operationId: deactivateDevice
      tags: [license]
      summary: Deactivate a device (through Dodo and locally)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated license view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [meta]
      summary: Pricing table, targets, limits and models
      security: []
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'

  /v1/products:
    get:
      operationId: listProducts
      tags: [meta]
      summary: What is for sale, with live prices
      description: >-
        Public: the website renders its pricing from this rather than hard-coding a
        product id or an amount. `credits` is the server-side truth that checkout
        charges from; the money comes from the payment provider, so there is one
        source of truth for it. `price` is null when the provider could not be
        reached — the credits are still exact.
      security: []
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'

  /v1/jobs:
    post:
      operationId: createJob
      tags: [jobs]
      summary: Credit preflight with the declared numbers, then upload URLs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: Job created, upload plan returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Insufficient credits (carries estimatedCost and balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A job is already running for this license
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Daily job limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloud upscaling disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/jobs/transcribe:
    post:
      operationId: createTranscribeJob
      tags: [transcription]
      summary: Credit preflight for a transcription, then the audio upload URL
      description: >-
        The same shape as `POST /v1/jobs`, for an audio file instead of a video.
        The preflight prices the *declared* audio length; the server re-prices
        from its own probe of the uploaded audio and that number is final (0.8).
        Settlement follows the same reserve/settle/refund rules as an upscale
        (0.3), priced per minute of audio rather than per frame. The transcript
        is delivered as a JSON object and fetched through the same `downloadUrl`
        on the job view.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranscribeJobRequest'
      responses:
        '200':
          description: Job created, upload plan returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Insufficient credits (carries estimatedCost and balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A job is already running for this license
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Daily job limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloud transcription disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Job status, progress and a fresh download URL
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job, applying the settlement rules
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            `canceling` while a running job winds down, `canceled` once it is
            settled. If the job was already terminal when the request arrived, its
            actual status is returned instead (`succeeded`, `failed`, `rejected`),
            because claiming a cancel that never happened would be misleading.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [canceling, canceled, succeeded, failed, rejected]

  /v1/jobs/{id}/upload/complete:
    post:
      operationId: completeJobUpload
      tags: [jobs]
      summary: Finish the source upload (required for multipart)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber:
                        type: integer
                      etag:
                        type: string
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/jobs/{id}/start:
    post:
      operationId: startJob
      tags: [jobs]
      summary: Begin validation and hand the job to the worker; returns immediately
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validating
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [validating]
        '409':
          description: Job is not uploaded, or another job is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloud upscaling disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/jobs/{id}/probe-result:
    post:
      operationId: workerProbeResult
      tags: [internal]
      summary: Worker reports probe findings (HMAC signed with the job secret)
      security: []
      parameters:
        - $ref: '#/components/parameters/WorkerSignature'
        - $ref: '#/components/parameters/WorkerTimestamp'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/jobs/{id}/heartbeat:
    post:
      operationId: workerHeartbeat
      tags: [internal]
      summary: Worker progress; the response carries the cancel flag
      security: []
      parameters:
        - $ref: '#/components/parameters/WorkerSignature'
        - $ref: '#/components/parameters/WorkerTimestamp'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancel flag
          content:
            application/json:
              schema:
                type: object
                required: [cancel]
                properties:
                  cancel:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/jobs/{id}/complete:
    post:
      operationId: workerComplete
      tags: [internal]
      summary: Worker reports the final outcome; the job is settled
      security: []
      parameters:
        - $ref: '#/components/parameters/WorkerSignature'
        - $ref: '#/components/parameters/WorkerTimestamp'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/reap:
    post:
      operationId: reapJobs
      tags: [internal]
      summary: Operator backstop; reaps stale jobs and expired cancels
      security: []
      parameters:
        - name: X-Reap-Secret
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  reaped:
                    type: integer
                  canceled:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    WorkerSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC-SHA256 of `{timestamp}.{raw body}` with the per-job callback secret
    WorkerTimestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
      description: Unix seconds; stale requests are rejected
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or signature invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, service, version, env, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          examples: [demothat-api]
        version:
          type: string
        env:
          type: string
          enum: [development, test, production]
        commit:
          type: [string, 'null']
        time:
          type: string
          format: date-time
    CheckoutRequest:
      type: object
      required: [productId]
      properties:
        productId:
          type: string
          description: Dodo product id; the credit amount comes from the server-side PRODUCTS table
        deviceIdHash:
          type: string
          description: Optional opaque device hash carried through for the app
    CheckoutResponse:
      type: object
      required: [purchaseId, pollToken, checkoutUrl]
      properties:
        purchaseId:
          type: string
        pollToken:
          type: string
          description: Shown once; send it as X-Poll-Token when polling
        checkoutUrl:
          type: string
          format: uri
    PurchaseStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, succeeded, failed]
        balance:
          type: integer
          description: License credit balance once the license exists
        licenseKey:
          type: string
          description: Returned exactly once, on a first purchase, then removed
    DeviceView:
      type: object
      required: [id, label, platform, active, activatedAt, lastSeenAt, current]
      properties:
        id:
          type: string
        label:
          type: string
        platform:
          type: string
        active:
          type: boolean
        activatedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the device making the request
    ActivateRequest:
      type: object
      required: [licenseKey, deviceIdHash, label, platform]
      properties:
        licenseKey:
          type: string
        deviceIdHash:
          type: string
          description: Client-computed hash of the device identifier
        label:
          type: string
        platform:
          type: string
    ActivateResponse:
      type: object
      required: [token, balance, devices]
      properties:
        token:
          type: string
          description: EdDSA license token; send as Authorization Bearer
        balance:
          type: integer
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceView'
    LicenseView:
      type: object
      required: [plan, balance, devices]
      properties:
        plan:
          type: string
        balance:
          type: integer
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceView'
    Capabilities:
      type: object
      required: [creditsPerFrame, targets, limits, models, minChargeCredits, cloudEnabled]
      properties:
        creditsPerFrame:
          type: object
          additionalProperties:
            type: number
        targets:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            maxDurationSeconds:
              type: integer
            maxTargetWidth:
              type: integer
            maxTargetHeight:
              type: integer
            maxFileSizeBytes:
              type: integer
            maxConcurrentJobs:
              type: integer
            dailyJobCap:
              type: integer
        models:
          type: array
          items:
            type: string
        minChargeCredits:
          type: integer
        cloudEnabled:
          type: boolean
        multipartThresholdBytes:
          type: integer
        transcription:
          $ref: '#/components/schemas/TranscriptionCapabilities'
    TranscriptionCapabilities:
      type: object
      description: >-
        What the transcription service publishes so the app can quote a price
        before it uploads anything. `creditsPerMinute` is the same number the
        server charges from; the app mirrors it for the estimate and never
        sends a price of its own.
      required: [enabled, creditsPerMinute, models]
      properties:
        enabled:
          type: boolean
          description: False when cloud transcription is switched off for this deployment.
        creditsPerMinute:
          type: number
          minimum: 0
          description: >-
            Credits per minute of probed audio, `ceil`ed. Defaults to the cost of
            a 30 fps 1080p cloud upscale of the same clip, so transcription
            starts out priced like the export it accompanies.
        models:
          type: array
          items:
            type: string
          description: Model names `CreateTranscribeJobRequest.model` accepts.
        maxAudioSeconds:
          type: integer
          description: Longest audio the worker will accept.
    ProductPrice:
      type: object
      description: >-
        A price as rendered, not as charged. `amountMinor` is an integer in the
        smallest denomination of `currency`, so divide by 10^`minorUnitExponent` —
        2 for USD, but 0 for zero-decimal currencies such as JPY, which is why the
        exponent is published instead of assumed.
      required: [amountMinor, currency, minorUnitExponent, isMinimum]
      properties:
        amountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          examples: [USD]
        minorUnitExponent:
          type: integer
          minimum: 0
        isMinimum:
          type: boolean
          description: >-
            true when `amountMinor` is a floor rather than the price, i.e. the
            product is pay-what-you-want.
    Product:
      type: object
      required: [productId, kind, credits, price]
      properties:
        productId:
          type: string
          description: Pass this back to `POST /v1/checkout`.
        kind:
          type: string
          enum: [first_purchase, topup]
        credits:
          type: integer
          minimum: 1
          description: Credits granted by one unit. Server-side truth (0.8).
        name:
          type: string
        description:
          type: string
        isRecurring:
          type: boolean
        price:
          description: null when the payment provider could not be reached.
          oneOf:
            - $ref: '#/components/schemas/ProductPrice'
            - type: 'null'
    ProductList:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CreateJobRequest:
      type: object
      required:
        [sourceWidth, sourceHeight, fps, durationSec, fileSizeBytes, targetWidth, targetHeight]
      properties:
        sourceWidth:
          type: integer
        sourceHeight:
          type: integer
        fps:
          type: number
        durationSec:
          type: number
        fileSizeBytes:
          type: integer
        targetWidth:
          type: integer
        targetHeight:
          type: integer
    CreateTranscribeJobRequest:
      type: object
      required: [audioSeconds, fileSizeBytes]
      properties:
        audioSeconds:
          type: number
          description: >-
            Declared length of the audio about to be uploaded. Used for the
            preflight only; the charge comes from the server's own probe.
        fileSizeBytes:
          type: integer
        language:
          type: string
          description: ISO-639-1 hint, or `auto` to let the model decide.
        model:
          type: string
          description: One of `Capabilities.transcription.models`; omit for the server default.
    CreateJobResponse:
      type: object
      required: [jobId, estimatedCost, upload]
      properties:
        jobId:
          type: string
        estimatedCost:
          type: integer
        upload:
          oneOf:
            - type: object
              required: [type, url]
              properties:
                type:
                  type: string
                  enum: [single]
                url:
                  type: string
                  format: uri
            - type: object
              required: [type, uploadId, partSize, partUrls]
              properties:
                type:
                  type: string
                  enum: [multipart]
                uploadId:
                  type: string
                partSize:
                  type: integer
                partUrls:
                  type: array
                  items:
                    type: string
                    format: uri
    JobView:
      type: object
      required: [status, stage, progress, reserved, consumed, cost, kind]
      properties:
        kind:
          type: string
          enum: [upscale, transcribe]
          description: >-
            What this job does. `upscale` jobs report `framesDone`/`totalFrames`;
            `transcribe` jobs report `audioSecondsDone`/`audioSeconds` instead.
        status:
          type: string
          enum:
            [
              created,
              uploading,
              uploaded,
              validating,
              rejected,
              queued,
              running,
              canceling,
              canceled,
              succeeded,
              failed,
              expired,
            ]
        stage:
          type: string
        progress:
          type: number
        framesDone:
          type: integer
          description: Frames written to the encoder. Present for `upscale` jobs only.
        totalFrames:
          type: integer
          description: Present for `upscale` jobs only.
        audioSeconds:
          type: number
          description: >-
            Audio length the worker probed, and the basis of the charge. Present
            for `transcribe` jobs only.
        audioSecondsDone:
          type: number
          description: Audio processed so far. Present for `transcribe` jobs only.
        reserved:
          type: integer
        consumed:
          type: integer
        etaSeconds:
          type: integer
        cost:
