<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/demothat-appicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemoThat</title>
    <script>
      // Apply the OS colour scheme before first paint so a dark-preferring user
      // never sees a light flash. The persisted override (electron-store
      // `appearance.mode`) is applied by App once settings finish loading.
      ;(function () {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
