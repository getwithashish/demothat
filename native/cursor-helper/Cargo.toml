[package]
name = "demothat-cursor-helper"
version = "0.1.0"
edition = "2021"
description = "Wayland capture and cursor telemetry helper for DemoThat"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "demothat-cursor-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Portal client. ScreenCast is the only interface we use: the compositor's own
# picker chooses the monitor, and cursor_mode=METADATA keeps the pointer out of
# the pixels so the editor can draw and animate its own cursor.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
# evdev is pure Rust over /dev/input, so the helper needs no libevdev at runtime.
evdev = "0.13"
libc = "0.2"
# PipeWire consumer: the frames the portal hands us. The -sys crate is used
# directly for buffers, because the safe wrapper does not expose the cursor meta
# region the pointer's position arrives in.
pipewire = "0.8"
pipewire-sys = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
